<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vulnerable WebApp</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="./images/IMG-20251130-WA0100(1).jpg"
    />
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        display: flex;
        justify-content: center;
        padding: 50px;
      }
      .container {
        background: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px;
      }
      input,
      button {
        width: 100%;
        margin: 10px 0;
        padding: 10px;
        box-sizing: border-box;
      }
      button {
        background-color: #007bff;
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 4px;
      }
      button:hover {
        background-color: #0056b3;
      }
      .hidden {
        display: none;
      }
      #message {
        color: red;
        text-align: center;
        font-size: 14px;
      }

      .admin-btn {
        background-color: #28a745;
      }
      .admin-btn:hover {
        background-color: #218838;
      }
      .create-btn {
        background-color: #6c757d;
        margin-top: 15px;
      }
      .update-btn {
        background-color: #17a2b8;
        margin-top: 10px;
      }
      .update-btn:hover {
        background-color: #138496;
      }
      .delete-btn {
        background-color: #dc3545;
        margin-top: 10px;
      }
      .delete-btn:hover {
        background-color: #c82333;
      }
      .cancel-btn {
        background-color: #6c757d;
      }

      #users-list {
        background: #343a40;
        color: #00ff00;
        padding: 10px;
        border-radius: 4px;
        font-size: 12px;
        overflow-x: auto;
        margin-top: 15px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="auth-section">
        <h2>Login</h2>
        <input type="text" id="username" placeholder="Username" required />
        <input type="password" id="password" placeholder="Password" required />
        <button onclick="authenticate('login')">Login</button>
        <button onclick="authenticate('create')" class="create-btn">
          Not a user? Create acc
        </button>
        <p id="message"></p>
      </div>

      <div id="home-section" class="hidden">
        <h2>User Profile</h2>
        <div
          id="user-info"
          style="
            background: #e9ecef;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
            word-wrap: break-word;
          "
        >
          Loading user info...
        </div>

        <button class="update-btn" onclick="openUpdateForm()">
          Update Profile
        </button>
        <button class="delete-btn" onclick="deleteAccount()">
          Delete Account
        </button>

        <!-- Admin Only Controls -->
        <button
          id="admin-dash-btn"
          class="admin-btn hidden"
          onclick="loadDashboard()"
          style="margin-top: 20px"
        >
          Special Dashboard
        </button>
        <p id="dashboard-info" style="color: #d39e00; font-weight: bold"></p>

        <!-- Updated Query Search Area -->
        <input
          type="text"
          id="search-username"
          class="hidden"
          placeholder="Enter username to search (optional)"
          style="margin-top: 10px"
        />
        <button
          id="admin-users-btn"
          class="admin-btn hidden"
          onclick="viewUsers()"
        >
          View Users
        </button>
        <pre id="users-list" class="hidden"></pre>

        <button onclick="logout()" class="cancel-btn" style="margin-top: 20px">
          Sign Out
        </button>
      </div>

      <div id="update-section" class="hidden">
        <h2>Update Profile</h2>
        <label for="update-username"><strong>Username</strong></label>
        <input type="text" id="update-username" placeholder="New Username" />

        <label for="update-password"><strong>New Password</strong></label>
        <input
          type="password"
          id="update-password"
          placeholder="Leave blank to keep current password"
        />

        <button class="admin-btn" onclick="submitUpdate()">Save Changes</button>
        <button class="cancel-btn" onclick="cancelUpdate()">Cancel</button>
        <p id="update-message" style="text-align: center; font-size: 14px"></p>
      </div>
    </div>

    <script>
      const API_URL = "http://127.0.0.1:8000";

      async function authenticate(action) {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const msgEl = document.getElementById("message");
        const endpoint = action === "login" ? "/login" : "/create-user";

        try {
          const response = await fetch(`${API_URL}${endpoint}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
            credentials: "include", // Automatically send/receive cookies
          });
          const data = await response.json();

          if (response.ok) {
            if (action === "login") {
              // We no longer save a JWT token. The browser securely handles the cookie.
              localStorage.setItem("username", username);
              showHome(username);
            } else {
              msgEl.style.color = "green";
              msgEl.innerText = "Account created! You can now login.";
            }
          } else {
            msgEl.style.color = "red";
            msgEl.innerText = data.detail || "An error occurred.";
          }
        } catch (err) {
          msgEl.innerText = "Failed to connect to the server.";
        }
      }

      async function showHome(username) {
        if (!username) return;

        document.getElementById("auth-section").classList.add("hidden");
        document.getElementById("update-section").classList.add("hidden");
        document.getElementById("home-section").classList.remove("hidden");

        // Toggle admin controls
        if (username === "admin") {
          document.getElementById("admin-dash-btn").classList.remove("hidden");
          document.getElementById("admin-users-btn").classList.remove("hidden");
          document.getElementById("search-username").classList.remove("hidden");
        } else {
          document.getElementById("admin-dash-btn").classList.add("hidden");
          document.getElementById("admin-users-btn").classList.add("hidden");
          document.getElementById("search-username").classList.add("hidden");
        }

        const response = await fetch(`${API_URL}/home/${username}`, {
          // Replaces the old Authorization header
          credentials: "include",
        });

        if (response.ok) {
          const data = await response.json();
          document.getElementById("user-info").innerText =
            `ID: ${data.id}\nUsername: ${data.username}`;
        } else {
          // If the cookie is expired or invalid, the backend rejects it and we force a logout
          logout();
        }
      }

      async function viewUsers() {
        const currentUsername = localStorage.getItem("username");
        const usersListEl = document.getElementById("users-list");
        const targetUser = document
          .getElementById("search-username")
          .value.trim();

        let endpoint = `${API_URL}/home/${currentUsername}/view-users`;
        if (targetUser) {
          endpoint += `?user_to_view=${encodeURIComponent(targetUser)}`;
        }

        try {
          const response = await fetch(endpoint, {
            credentials: "include",
          });

          if (response.ok) {
            const data = await response.json();
            usersListEl.classList.remove("hidden");
            usersListEl.innerText = data.users
              ? JSON.stringify(data.users, null, 2)
              : "User not found in database.";
          } else {
            const errData = await response.json();
            alert(errData.detail || "Access Denied.");
          }
        } catch (err) {
          alert("Error connecting to server.");
        }
      }

      async function deleteAccount() {
        const username = localStorage.getItem("username");

        if (
          !confirm(
            "Are you sure you want to delete your account? This action cannot be undone.",
          )
        ) {
          return;
        }

        try {
          const response = await fetch(
            `${API_URL}/home/${username}/delete-user`,
            {
              method: "DELETE",
              credentials: "include",
            },
          );
          const data = await response.json();

          if (response.ok) {
            logout();
            const msgEl = document.getElementById("message");
            msgEl.style.color = "green";
            msgEl.innerText = `Account deleted: ${data.deleted}`;
          } else {
            alert(data.detail || "Failed to delete account.");
          }
        } catch (err) {
          alert("Error connecting to server.");
        }
      }

      function openUpdateForm() {
        const currentUsername = localStorage.getItem("username");
        document.getElementById("home-section").classList.add("hidden");
        document.getElementById("update-section").classList.remove("hidden");
        document.getElementById("update-username").value = currentUsername;
        document.getElementById("update-password").value = "";
        document.getElementById("update-message").innerText = "";

        document.getElementById("users-list").classList.add("hidden");
        document.getElementById("users-list").innerText = "";
        document.getElementById("search-username").value = "";
        document.getElementById("dashboard-info").innerText = "";
      }

      function cancelUpdate() {
        document.getElementById("update-section").classList.add("hidden");
        document.getElementById("home-section").classList.remove("hidden");
      }

      async function submitUpdate() {
        const currentUsername = localStorage.getItem("username");
        const newUsername = document.getElementById("update-username").value;
        const newPassword = document.getElementById("update-password").value;
        const msgEl = document.getElementById("update-message");

        const payload = {
          username: newUsername || null,
          password: newPassword || null,
        };

        try {
          const response = await fetch(
            `${API_URL}/home/${currentUsername}/update`,
            {
              method: "PUT",
              headers: {
                "Content-Type": "application/json",
              },
              credentials: "include", // Backend automatically issues a new session cookie here
              body: JSON.stringify(payload),
            },
          );

          const data = await response.json();

          if (response.ok) {
            if (newPassword) {
              alert("Password updated successfully. Please log in again.");
              logout();
              return;
            }
            if (newUsername) {
              localStorage.setItem("username", newUsername);
            }
            alert(`Status: ${data.updated}`);
            showHome(localStorage.getItem("username"));
          } else {
            msgEl.style.color = "red";
            msgEl.innerText = data.detail || "Update failed.";
          }
        } catch (err) {
          msgEl.style.color = "red";
          msgEl.innerText = "Error connecting to server.";
        }
      }

      async function loadDashboard() {
        const dashInfo = document.getElementById("dashboard-info");

        const response = await fetch(`${API_URL}/home/dashboard`, {
          credentials: "include",
        });

        if (response.ok) {
          const data = await response.json();
          dashInfo.innerText = `${data.secret_data} | Balance: ${data.balance}`;
        } else {
          dashInfo.innerText = "Access Denied.";
        }
      }

      async function logout() {
        // We must hit the new /logout endpoint so the server deletes the HttpOnly cookie
        try {
          await fetch(`${API_URL}/logout`, {
            method: "POST",
            credentials: "include",
          });
        } catch (err) {
          console.error("Failed to log out on server.");
        }

        // Clean up UI local storage
        localStorage.removeItem("username");

        document.getElementById("auth-section").classList.remove("hidden");
        document.getElementById("home-section").classList.add("hidden");
        document.getElementById("update-section").classList.add("hidden");

        document.getElementById("dashboard-info").innerText = "";
        document.getElementById("users-list").innerText = "";
        document.getElementById("users-list").classList.add("hidden");
        document.getElementById("search-username").value = "";
        document.getElementById("message").innerText = "Logged out.";
        document.getElementById("username").value = "";
        document.getElementById("password").value = "";
      }

      // Check if logged in on page refresh
      const savedUser = localStorage.getItem("username");
      if (savedUser) {
        showHome(savedUser);
      }
    </script>
  </body>
</html>
