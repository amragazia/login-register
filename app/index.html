<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vulnerable WebApp</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        display: flex;
        justify-content: center;
        padding: 50px;
      }
      .container {
        background: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px;
      }
      input,
      button {
        width: 100%;
        margin: 10px 0;
        padding: 10px;
        box-sizing: border-box;
      }
      button {
        background-color: #007bff;
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 4px;
      }
      button:hover {
        background-color: #0056b3;
      }
      .hidden {
        display: none;
      }
      #message {
        color: red;
        text-align: center;
        font-size: 14px;
      }

      /* Button Specific Colors */
      .admin-btn {
        background-color: #28a745;
      }
      .admin-btn:hover {
        background-color: #218838;
      }
      .create-btn {
        background-color: #6c757d;
        margin-top: 15px;
      }
      .update-btn {
        background-color: #17a2b8;
        margin-top: 10px;
      }
      .update-btn:hover {
        background-color: #138496;
      }
      .delete-btn {
        background-color: #dc3545;
        margin-top: 10px;
      }
      .delete-btn:hover {
        background-color: #c82333;
      }
      .cancel-btn {
        background-color: #6c757d;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="auth-section">
        <h2>Login</h2>
        <input type="text" id="username" placeholder="Username" required />
        <input type="password" id="password" placeholder="Password" required />
        <button onclick="authenticate('login')">Login</button>
        <button onclick="authenticate('create')" class="create-btn">
          Not a user? Create acc
        </button>
        <p id="message"></p>
      </div>

      <div id="home-section" class="hidden">
        <h2>User Profile</h2>
        <div
          id="user-info"
          style="
            background: #e9ecef;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
            word-wrap: break-word;
          "
        >
          Loading user info...
        </div>

        <button class="update-btn" onclick="openUpdateForm()">
          Update Profile
        </button>
        <button class="delete-btn" onclick="deleteAccount()">
          Delete Account
        </button>

        <button
          id="admin-btn"
          class="admin-btn hidden"
          onclick="loadDashboard()"
          style="margin-top: 20px"
        >
          Special Dashboard
        </button>
        <p id="dashboard-info" style="color: #d39e00; font-weight: bold"></p>

        <button onclick="logout()" class="cancel-btn" style="margin-top: 20px">
          Sign Out
        </button>
      </div>

      <div id="update-section" class="hidden">
        <h2>Update Profile</h2>
        <label for="update-username"><strong>Username</strong></label>
        <input type="text" id="update-username" placeholder="New Username" />

        <label for="update-password"><strong>New Password</strong></label>
        <input
          type="password"
          id="update-password"
          placeholder="Leave blank to keep current password"
        />

        <button class="admin-btn" onclick="submitUpdate()">Save Changes</button>
        <button class="cancel-btn" onclick="cancelUpdate()">Cancel</button>
        <p id="update-message" style="text-align: center; font-size: 14px"></p>
      </div>
    </div>

    <script>
      const API_URL = "http://127.0.0.1:8000";

      async function authenticate(action) {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const msgEl = document.getElementById("message");
        const endpoint = action === "login" ? "/login" : "/create-user";

        try {
          const response = await fetch(`${API_URL}${endpoint}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });
          const data = await response.json();

          if (response.ok) {
            if (action === "login") {
              localStorage.setItem("token", data.access_token);
              localStorage.setItem("username", username);
              showHome(username);
            } else {
              msgEl.style.color = "green";
              msgEl.innerText = "Account created! You can now login.";
            }
          } else {
            msgEl.style.color = "red";
            msgEl.innerText = data.detail || "An error occurred.";
          }
        } catch (err) {
          msgEl.innerText = "Failed to connect to the server.";
        }
      }

      async function showHome(username) {
        const token = localStorage.getItem("token");
        if (!token) return;

        // Reset visibility
        document.getElementById("auth-section").classList.add("hidden");
        document.getElementById("update-section").classList.add("hidden");
        document.getElementById("home-section").classList.remove("hidden");

        if (username === "admin") {
          document.getElementById("admin-btn").classList.remove("hidden");
        } else {
          document.getElementById("admin-btn").classList.add("hidden");
        }

        const response = await fetch(`${API_URL}/home/${username}`, {
          headers: { Authorization: `Bearer ${token}` },
        });

        if (response.ok) {
          const data = await response.json();
          document.getElementById("user-info").innerText =
            `ID: ${data.id}\nUsername: ${data.username}`;
        } else {
          logout();
        }
      }

      /* --- NEW DELETE LOGIC --- */
      async function deleteAccount() {
        const username = localStorage.getItem("username");
        const token = localStorage.getItem("token");

        // Confirm before executing the destructive action
        if (
          !confirm(
            "Are you sure you want to delete your account? This action cannot be undone.",
          )
        ) {
          return;
        }

        try {
          // Hitting the delete endpoint
          const response = await fetch(
            `${API_URL}/home/${username}/delete-user`,
            {
              method: "DELETE",
              headers: { Authorization: `Bearer ${token}` },
            },
          );
          const data = await response.json();

          if (response.ok) {
            logout(); // Clear session
            const msgEl = document.getElementById("message");
            msgEl.style.color = "green";
            msgEl.innerText = `Account deleted: ${data.deleted}`; // Display the return message
          } else {
            alert(data.detail || "Failed to delete account.");
          }
        } catch (err) {
          alert("Error connecting to server.");
        }
      }

      /* --- NEW UPDATE LOGIC --- */
      function openUpdateForm() {
        const currentUsername = localStorage.getItem("username");

        // Hide Home, Show Update Form
        document.getElementById("home-section").classList.add("hidden");
        document.getElementById("update-section").classList.remove("hidden");

        // Pre-fill the current data
        document.getElementById("update-username").value = currentUsername;
        document.getElementById("update-password").value = ""; // Leave password blank for security
        document.getElementById("update-message").innerText = "";
      }

      function cancelUpdate() {
        // Return to the home screen without saving
        document.getElementById("update-section").classList.add("hidden");
        document.getElementById("home-section").classList.remove("hidden");
      }

      async function submitUpdate() {
        const currentUsername = localStorage.getItem("username");
        const token = localStorage.getItem("token");

        const newUsername = document.getElementById("update-username").value;
        const newPassword = document.getElementById("update-password").value;
        const msgEl = document.getElementById("update-message");

        // The FastAPI backend requires the User schema (username and password)
        const payload = {
          username: newUsername || null,
          password: newPassword || null,
        };

        try {
          // Hitting the update endpoint using PUT [cite: 310]
          const response = await fetch(
            `${API_URL}/home/${currentUsername}/update`,
            {
              method: "PUT",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`,
              },
              body: JSON.stringify(payload),
            },
          );

          const data = await response.json();

          // Replace the 'if (response.ok)' block in submitUpdate() with this:
          if (response.ok) {
            // 1. If password changed, kill the session and force a re-login
            if (newPassword) {
              alert("Password updated successfully. Please log in again.");
              logout();
              return;
            }

            // 2. If username changed, save the new name AND the new token
            if (newUsername) {
              localStorage.setItem("username", newUsername);
              localStorage.setItem("token", data.access_token);
            }

            alert(`Status: ${data.updated}`);
            showHome(localStorage.getItem("username"));
          } else {
            msgEl.style.color = "red";
            msgEl.innerText = data.detail || "Update failed.";
          }
        } catch (err) {
          msgEl.style.color = "red";
          msgEl.innerText = "Error connecting to server.";
        }
      }

      /* --- DASHBOARD & LOGOUT --- */
      async function loadDashboard() {
        const token = localStorage.getItem("token");
        const dashInfo = document.getElementById("dashboard-info");

        const response = await fetch(`${API_URL}/home/dashboard`, {
          headers: { Authorization: `Bearer ${token}` },
        });

        if (response.ok) {
          const data = await response.json();
          dashInfo.innerText = `${data.secret_data} | Balance: ${data.balance}`;
        } else {
          dashInfo.innerText = "Access Denied.";
        }
      }

      function logout() {
        localStorage.removeItem("token");
        localStorage.removeItem("username");

        // Hide everything except the auth section
        document.getElementById("auth-section").classList.remove("hidden");
        document.getElementById("home-section").classList.add("hidden");
        document.getElementById("update-section").classList.add("hidden");

        document.getElementById("dashboard-info").innerText = "";
        document.getElementById("message").innerText = "Logged out.";
        document.getElementById("username").value = "";
        document.getElementById("password").value = "";
      }

      // Persist login state on page refresh
      const savedToken = localStorage.getItem("token");
      const savedUser = localStorage.getItem("username");
      if (savedToken && savedUser) {
        showHome(savedUser);
      }
    </script>
  </body>
</html>
